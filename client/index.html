<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vocaburn" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var msg = String(message || "");
        var src = String(source || "");
        var err = error ? String(error.message || error) : "";
        if (
          msg.indexOf("import.meta.resolve") !== -1 || 
          msg.indexOf("legacy-guard") !== -1 ||
          src.indexOf("import.meta.resolve") !== -1 ||
          src.indexOf("legacy-guard") !== -1 ||
          err.indexOf("import.meta.resolve") !== -1 ||
          err.indexOf("legacy-guard") !== -1 ||
          !src ||
          src.indexOf("chrome-extension") !== -1 ||
          src.indexOf("moz-extension") !== -1 ||
          src.indexOf("<anonymous>") !== -1 ||
          msg.indexOf("startTime") !== -1 ||
          msg.indexOf("reportAllChanges") !== -1
        ) {
          console.warn("Ignored external or non-critical error:", msg, src);
          return true; // Ignore external/extension/legacy errors
        }
        alert("Runtime Error: " + message + "\nSource: " + source + "\nLine: " + lineno + ":" + colno);
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? String(event.reason.message || event.reason) : "";
        if (
          reason.indexOf("import.meta.resolve") !== -1 || 
          reason.indexOf("legacy-guard") !== -1 ||
          reason.indexOf("startTime") !== -1 ||
          reason.indexOf("reportAllChanges") !== -1
        ) {
          console.warn("Ignored Vite legacy or external rejection:", reason);
          return; // Ignore Vite legacy and external promise rejections
        }
        alert("Unhandled Promise Rejection: " + event.reason);
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(err) {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
    <title>Vocaburn — Spaced Repetition Flashcards</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800;900&family=Inter:wght@100..900&family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&family=Fredoka:wght@600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
